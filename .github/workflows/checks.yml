name: Checks
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/e2e/check.mjs
        env:
          WATERLOO_TEST_BROWSERS: chromium
      - run: node tests/e2e/park.mjs
      - run: node tests/e2e/realism.mjs
      - run: node tests/e2e/participation.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-checks
          path: outputs/browser-checks
          if-no-files-found: ignore
